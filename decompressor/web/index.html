<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="拖动物品装箱，再点击、拖拽或抛摔纸箱把破事处理掉。原文不上传、不保存。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>烦恼回收站</title>
<style>
:root {
  --paper: #fffcf1;
  --ink: #263f4a;
  --muted: #899599;
  --stage: #fff;
  --green: #397469;
  --font: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--stage); }
body { color: var(--ink); font: 15px/1.6 var(--font); touch-action: none; }
button, textarea { font: inherit; }
[hidden] { display: none !important; }
.stage { position: fixed; inset: 0; overflow: hidden; background: var(--stage); }
#scene { display: block; width: 100%; height: 100%; touch-action: none; }
.note-paper {
  position: fixed;
  z-index: 2;
  top: max(36px, calc(env(safe-area-inset-top) + 20px));
  left: 50%;
  width: min(82vw, 390px);
  min-height: 206px;
  padding: 18px;
  border-radius: 5px;
  background: var(--paper);
  box-shadow: 0 12px 34px rgba(38, 63, 74, .14);
  transform: translateX(-50%) rotate(-1deg);
}
.note-label { display: block; margin-bottom: 8px; color: var(--ink); font-size: 14px; font-weight: 650; }
#worry-note {
  display: block;
  width: 100%;
  height: 100px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 18px;
  line-height: 1.65;
}
#worry-note::placeholder { color: #9aa4a2; }
.tag-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
.tag-item { padding: 6px 12px; border: 1px solid #d8dede; border-radius: 999px; background: rgba(255,255,255,.58); color: #718087; font-size: 12px; }
.tag-item.active { border-color: var(--ink); background: var(--ink); color: #fff; }
.note-next {
  width: 100%;
  min-height: 44px;
  margin-top: 12px;
  padding: 9px 14px;
  border: 0;
  border-radius: 7px;
  background: var(--ink);
  color: #fff;
  font-size: 14px;
  font-weight: 650;
}
.note-next:disabled { background: #d8dede; }
.result-card {
  position: fixed;
  z-index: 4;
  top: max(18px, calc(env(safe-area-inset-top) + 12px));
  left: 50%;
  width: min(86vw, 410px);
  padding: 20px;
  transform: translateX(-50%);
  border: 1px solid #397469;
  border-radius: 12px;
  background: rgba(251, 252, 251, .96);
  box-shadow: 0 14px 38px rgba(27, 48, 53, .18);
  text-align: center;
}
.result-card.tier-1 { border-color: #79558b; }
.result-card.tier-2 { border-color: #4774a8; }
.result-card.tier-3 { border-color: #d2a83f; }
.result-kicker { color: #718087; font-size: 11px; letter-spacing: 3px; }
.result-card h1 { margin: 5px 0 0; font-size: 22px; line-height: 1.4; }
.result-line { margin-top: 6px; font-size: 18px; font-weight: 650; }
.result-status, .result-summary { margin-top: 6px; color: #718087; font-size: 12px; }
.result-actions { display: flex; gap: 10px; margin-top: 16px; }
.result-actions button { flex: 1; min-height: 44px; margin: 0; border: 0; border-radius: 7px; font-weight: 650; }
.result-share { background: var(--ink); color: #fff; }
.result-again { background: #e9eeee; color: var(--ink); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
dialog {
  width: min(430px, calc(100% - 28px));
  padding: 52px 25px 28px;
  border: 1px solid rgba(38, 63, 74, .16);
  border-radius: 16px;
  background: #fbfcfb;
  color: #526267;
  font-size: 12.5px;
  line-height: 1.78;
  box-shadow: 0 20px 60px rgba(11, 20, 23, .3);
}
dialog::backdrop { background: rgba(18, 27, 30, .74); }
.privacy-content { display: flex; flex-direction: column; gap: 10px; }
.privacy-content p { margin: 0; }
.privacy-content .muted { color: var(--muted); }
.close {
  position: absolute;
  top: 10px;
  right: 14px;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #718087;
  font-size: 27px;
  line-height: 34px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<main class="stage">
  <canvas id="scene" width="800" height="1600" role="img" aria-label="把今天的破事写下来，打包处理"></canvas>
  <div id="note-paper" class="note-paper">
    <label class="note-label" for="worry-note">今天又是哪件破事</label>
    <textarea id="worry-note" rows="3" placeholder="" autocomplete="off" spellcheck="false" autofocus></textarea>
    <div id="tag-list" class="tag-list" aria-label="选择烦恼分类"></div>
    <button id="note-next" class="note-next" type="button" disabled>打包，别留着过夜</button>
  </div>
  <section id="result-card" class="result-card" aria-label="烦恼回收结果" hidden>
    <div class="result-kicker">本次发疯已妥善处理</div>
    <h1 id="result-title"></h1>
    <div id="result-line" class="result-line"></div>
    <div id="result-status" class="result-status"></div>
    <div id="result-summary" class="result-summary"></div>
    <div class="result-actions">
      <button id="result-share" class="result-share" type="button">发给同样命苦的</button>
      <button id="result-again" class="result-again" type="button">还有一件</button>
    </div>
  </section>
  <span id="status" class="sr-only" aria-live="polite"></span>
</main>

<dialog id="privacy-dialog" aria-label="隐私说明">
  <button id="privacy-close" class="close" type="button" aria-label="关闭">×</button>
  <div class="privacy-content">
    <p>烦恼原文只存在当前页面运行内存中。完成封箱并进入破坏阶段后，原文会立即清空，不上传，也不会写入本机存储。</p>
    <p>本机只保存累计完成过的回收日期，用于计算回收天数和切换结果样式；这些记录不包含原文、姓名、头像、公司或联系方式。</p>
    <p>震动只用于点击和撞击反馈；声音均为产品内置本地音效，不使用麦克风，也不会录音。</p>
    <p>浏览器分享不会自动包含你写下的内容。</p>
    <p class="muted">这是虚拟解压玩具，不提供心理诊断或治疗。若压力持续影响生活，建议向可信赖的人或专业人士寻求帮助。</p>
  </div>
</dialog>

<script src="core.js"></script>
<script src="scene.js"></script>
<script src="physics.js"></script>
<script src="progress.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
